<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>کانون رسانه دانشگاه کاشان</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0e1f;--teal:#1fd1bd;--rose:#ff4d8d;--amber:#ffb23e;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--ink);color:#fff;min-height:100vh;overflow-x:hidden;line-height:1.9}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 50% 0,#17204a,var(--ink) 70%)}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--teal);top:-12vmax;right:-10vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--rose);bottom:-14vmax;left:-8vmax;animation-delay:-6s}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:var(--amber);top:40%;left:35%;opacity:.28;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.2)}}
#intro{position:fixed;inset:0;z-index:99;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .9s,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
#intro img{width:min(300px,70vw);animation:pop 1.6s cubic-bezier(.2,.9,.3,1.2) both,glow 2s ease-in-out infinite alternate}
#intro b{font-weight:800;font-size:1.3rem;letter-spacing:.02em;animation:rise 1.2s .6s both}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@keyframes glow{to{filter:drop-shadow(0 0 28px var(--teal))}}
header{display:flex;align-items:center;justify-content:center;gap:16px;padding:40px 20px 8px}
header img{width:min(120px,26vw);filter:drop-shadow(0 0 18px rgba(31,209,189,.5))}
h1{font-size:clamp(1.3rem,5vw,2.6rem);font-weight:800;line-height:1.5}
.welcome{max-width:620px;margin:14px auto 0;padding:0 20px;text-align:center;color:#dfe6ff;font-weight:300;font-size:1.05rem}
main{max-width:640px;margin:34px auto;padding:0 16px;display:grid;gap:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .4s,box-shadow .4s}
.card.open{border-color:var(--teal);box-shadow:0 0 40px -10px var(--teal)}
.head{width:100%;background:none;border:0;color:#fff;font:800 1.25rem Vazirmatn,Tahoma;padding:22px 16px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.3,.8,.2,1)}
.sub.open{grid-template-rows:1fr}
.sub>div{overflow:hidden;min-height:0}
.inner{padding:0 20px 22px;text-align:center}
.desc{color:#e6ebff;font-weight:300;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:500 .95rem Vazirmatn,Tahoma;border:0;border-radius:14px;padding:11px 20px;cursor:pointer;color:#06222a;background:linear-gradient(135deg,var(--teal),#7af0e0);text-decoration:none;display:inline-block;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:#fff;border:1px solid var(--line)}
.btn.rose{background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.chips a{font-size:.8rem;padding:2px 12px;border-radius:99px;border:1px solid var(--line);color:#fff;text-decoration:none}
.box{margin-top:14px}
form{display:grid;gap:10px;text-align:right}
label{font-size:.85rem;color:#cdd6ff}
input,textarea,select{width:100%;font:300 1rem Vazirmatn,Tahoma;color:#fff;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
input[type=file]{padding:8px;font-size:.85rem}
select option{color:#000}
.ok{color:var(--teal);font-weight:500}.err{color:#ff8aa8;font-size:.9rem}
.contact{text-align:center;margin:10px 0 40px}
.contact h2{font-size:1.1rem;margin-bottom:10px}
footer{text-align:center;padding:0 0 30px}
footer button{background:none;border:0;color:#7e89b8;font:300 .8rem Vazirmatn;cursor:pointer}
#admin{position:fixed;inset:0;z-index:50;background:#0a0e1fef;overflow:auto;padding:20px;display:none}
#admin.show{display:block}
.panel{max-width:860px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs .btn.on{background:var(--amber);color:#2a1a00}
.item{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;gap:8px}
.item h4{color:var(--teal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--teal:#ffd28f}
.btn{color:#2b1b05;background:linear-gradient(135deg,#ffd28f,#ffe5bd)}
.btn.alt{color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn.rose{background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff}
.bg{background:linear-gradient(120deg,#0d0d16 0,#121019 45%,#241a55 100%)}
.bg i:nth-child(1){background:#3a2a9a;top:-15vmax;right:-12vmax;opacity:.6}
.bg i:nth-child(2){background:#a8651f;bottom:-18vmax;left:-12vmax;opacity:.45}
.bg i:nth-child(3){background:#7a1f45;bottom:-14vmax;right:-8vmax;top:auto;left:auto;opacity:.5}
.beam{position:absolute;top:0;left:46%;width:min(70vw,780px);height:85vh;transform:translateX(-50%);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);background:linear-gradient(to bottom,rgba(255,235,200,.3),transparent 90%);animation:flick 7s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.65}}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:48px 24px 20px}
.strip{display:flex;gap:17px;margin-bottom:46px}
.strip span{width:18px;height:18px;border-radius:5px;background:#fff}
.eyebrow{color:var(--teal);margin-bottom:6px}
.hero h1{font:400 clamp(3.2rem,9vw,6.4rem)/1.12 Lalezar,Vazirmatn;margin:0}
.hero h1 span{color:var(--teal);display:block}
.lead{margin:22px 0 28px;color:#e6e9f7;font-size:1.08rem;max-width:640px}
.hero .logo{width:100%;max-width:540px;justify-self:center;filter:drop-shadow(0 10px 40px rgba(0,0,0,.5))}
.sech{padding-top:70px;scroll-margin-top:20px}
.sech h2,.contact h2{font:400 clamp(2rem,5vw,2.8rem) Lalezar,Vazirmatn}
.sech p{color:#aab2d6;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{min-height:140px;border-radius:24px;border:1px solid var(--line);color:#fff;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));backdrop-filter:blur(10px);font:400 1.45rem/1.5 Lalezar,Vazirmatn;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .3s,border-color .3s,box-shadow .3s}
.tile small{font:500 .8rem Vazirmatn}
.tile:hover{transform:translateY(-4px)}
.tile.on{border-color:var(--teal);box-shadow:0 0 36px -8px var(--teal)}
#detail{margin-top:16px}
.dcard{border-color:var(--teal);box-shadow:0 0 40px -12px var(--teal)}
.dcard .inner{padding:26px 22px;animation:rise .55s both}
.dt{font:400 1.8rem Lalezar,Vazirmatn;margin-bottom:8px}
.contact{margin:0;padding:70px 24px 90px;text-align:right}
.ccard{padding:30px;border-radius:26px;margin-top:20px}
.ccard p{color:#b9c0e0;margin-bottom:16px}
.contact .row{justify-content:flex-start}
.adminBtn{position:fixed;left:16px;bottom:16px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.hero .logo{order:-1;max-width:300px}.strip{justify-content:center;gap:10px}.lead{margin-inline:auto}.hero .row,.contact .row{justify-content:center}.contact{text-align:center}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}

.page{position:fixed;inset:0;z-index:30;overflow-y:auto;visibility:hidden;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .95s cubic-bezier(.75,0,.2,1),visibility 0s .95s}
.page.open{visibility:visible;clip-path:circle(150vmax at var(--x,50%) var(--y,50%));transition:clip-path .95s cubic-bezier(.75,0,.2,1)}
.page .bg{filter:hue-rotate(var(--h,0deg))}
.pgc{max-width:720px;margin:0 auto;padding:70px 22px 70px;text-align:center;position:relative}
.page.open .pgc>*{animation:rise .8s both}
.page.open .pgc>*:nth-child(2){animation-delay:.55s}.page.open .pgc>*:nth-child(3){animation-delay:.7s}.page.open .pgc>*:nth-child(4){animation-delay:.85s}.page.open .pgc>*:nth-child(5){animation-delay:1s}.page.open .pgc>*:nth-child(6){animation-delay:1.1s}
.page.open .pgc>.ico{animation:pop 1.1s .35s cubic-bezier(.2,.9,.3,1.3) both}
.ico{font-size:5rem;line-height:1.2;filter:drop-shadow(0 0 30px var(--teal))}
.pgt{font:400 clamp(2.6rem,9vw,4.4rem)/1.25 Lalezar,Vazirmatn}
.pgs{font-weight:500;margin-top:-6px}
.pgc .desc{font-size:1.1rem;margin:18px 0 22px}
.pgc .box{text-align:center}
.pgc .formcard{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:6px}
body.lock{overflow:hidden}

/* ===== نسخه موبایل ===== */
:root{color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.bg i{filter:blur(60px);animation-duration:28s}
.beam{height:60dvh}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:560px;margin:0 auto;padding:26px 20px 6px}
.hero .logo{order:-1;width:62%;max-width:230px;margin-bottom:4px}
.strip{justify-content:center;gap:9px;margin:10px 0 20px}
.strip span{width:12px;height:12px;border-radius:4px}
.hero h1{font-size:clamp(3rem,15vw,4.2rem)}
.lead{font-size:1rem;margin:16px 0 22px}
.hero .row,.contact .row,.page .row{flex-direction:column;align-items:stretch;width:100%}
.btn{min-height:50px;display:inline-flex;align-items:center;justify-content:center;padding:0 22px;font-size:1rem;border-radius:16px}
.btn:hover,.tile:hover{transform:none}
.btn:active,.tile:active{transform:scale(.97)}
.wrap{max-width:560px;padding:0 18px}
.sech{padding-top:44px}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.tile{min-height:116px;border-radius:20px;font-size:1.25rem;padding:12px 8px;backdrop-filter:none;-webkit-backdrop-filter:none}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.card{backdrop-filter:none;-webkit-backdrop-filter:none}
.contact{padding:44px 18px calc(100px + env(safe-area-inset-bottom,0px));text-align:center}
.ccard{padding:22px}
.pgc{padding:calc(80px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px))}
.ico{font-size:4rem}
.pgt{font-size:clamp(2.2rem,11vw,3.2rem)}
.pgc .desc{font-size:1.02rem}
.back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:40;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:rgba(10,14,31,.78);color:#fff;font:500 .95rem Vazirmatn,Tahoma;cursor:pointer}
.chips a{padding:6px 14px;font-size:.9rem}
input,textarea,select{font-size:16px;min-height:48px}
.adminBtn{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:40px;padding:0 14px;font-size:.85rem;opacity:.85}
#admin{padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
a:focus-visible,button:focus-visible{outline:3px solid #ffd28f;outline-offset:2px}
</style>
</head>

<section class="wrap sech" id="sections"><h2>بخش‌های کانون</h2><p>هر بخش یه دنیاست. روی اونی که به دلت می‌شینه بزن.</p><div class="grid" id="grid"></div></section>
<section class="wrap contact" id="contact"><h2>تماس با ما</h2><div class="card ccard"><p>سؤالی داری؟ مستقیم با ما در ارتباط باش.</p><div class="row"><a class="btn" href="tel:09104017402">تماس تلفنی</a><a class="btn alt" href="https://t.me/Amir8Mohammad5Ab" target="_blank" rel="noopener">پیام در تلگرام</a><button class="btn alt" id="cp">کپی شماره</button></div></div></section>
<div class="page" id="page"></div>
<button class="btn adminBtn" id="adminBtn">مدیریت</button>
<div id="admin"><div class="panel" id="panel"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF={pass:'123456',welcome:'خوش اومدی و ممنون که می‌خوای با ما همکاری کنی. کانون رسانه جاییه که ایده‌ها به تصویر، صدا و کلمه تبدیل می‌شن و هر کس با هر مهارتی جایی برای دیده‌شدن داره. بخشی که بیشتر از همه به دلت می‌شینه رو پیدا کن، روش بزن و بیا کنار ما.',
sections:[
{id:'screen',icon:'🎬',title:'اکران و ویدئو گیم',desc:'هر هفته دانشگاه رو به سینما تبدیل می‌کنیم! فیلم و انیمیشن روی پرده بزرگ، با دورهمی و حال‌وهوای خاص. عاشق بازی هم هستی؟ تورنمنت‌های گیم رو ما برگزار می‌کنیم و تو می‌تونی پشت صحنه‌ی هیجان باشی.'},
{id:'photo',icon:'📷',title:'عکاسی و فیلم‌برداری',desc:'لحظه‌های ماندگار دانشگاه رو تو می‌سازی! دوربین دست بگیر، از مراسم‌های مختلف عکس و فیلم بگیر و قاب‌هایی بساز که همه‌ی دانشگاه ببینن.'},
{id:'film',icon:'🎞️',title:'فیلم‌سازی',desc:'قصه‌ها اینجا جون می‌گیرن! از نوشتن فیلمنامه و نمایشنامه تا کارگردانی، بازیگری و ساخت فیلم کوتاه؛ ایده‌ات رو بیار تا با هم از روی کاغذ به پرده‌ی نقره‌ای برسونیمش. چه پشت دوربین باشی، چه جلوی دوربین، تو این گروه جا داری.'},
{id:'ai',icon:'🤖',title:'هوش مصنوعی',desc:'آینده همین‌جاست! ابزارهای هوش مصنوعی رو بشناس، طراحی کن و به بقیه معرفی کن. اگه کنجکاوی و دوست داری تکنولوژی رو به زبان ساده منتقل کنی، اینجا جای توئه.'},
{id:'edit',icon:'✂️',title:'ادیت و تولید محتوا',desc:'خلاقیت تو اینجا به تصویر تبدیل می‌شه. ادیت فیلم و کلیپ، طراحی گرافیک و ساخت هویت‌های بصری؛ از ایده تا خروجی نهایی، با ما بساز و بدرخش.'},
{id:'voice',icon:'🎙️',title:'گویندگی',sub:'رادیو آن',sc:'#4ad8a0',desc:'صدات رو به گوش دانشگاه برسون! پادکست ضبط کن، دوبله کن و با رادیو آن صدای کانون باش. لازم نیست حرفه‌ای باشی، فقط شور و علاقه بیار.'},
{id:'write',icon:'✍️',title:'نویسندگی',sub:'نبض قلم',sc:'#7aa8ff',desc:'قلمت رو به کار بنداز! از نوشتن مجله و کتاب تا خلق متن‌های تأثیرگذار؛ نبض قلم جاییه که کلمه‌های تو دیده و خونده می‌شن.'}
].map(s=>({...s,rt:'',rp:''})),members:[]};
let cfg=(()=>{try{const c=Object.assign({},DEF,JSON.parse(localStorage.getItem('kr_cfg2')));DEF.sections.forEach((s,i)=>{if(!c.sections.some(x=>x.id===s.id))c.sections.splice(i,0,s)});return c}catch(e){return DEF}})();
const save=()=>{try{localStorage.setItem('kr_cfg2',JSON.stringify(cfg))}catch(e){}};
const db=new Promise((res,rej)=>{const r=indexedDB.open('kanoon',1);r.onupgradeneeded=()=>r.result.createObjectStore('regs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('regs',m),q=f(t.objectStore('regs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const tg=v=>{v=(v||'').trim();if(!v)return'';if(/^https?:/.test(v))return v;if(/^t\.me/.test(v))return'https://'+v;return'https://t.me/'+v.replace(/^@/,'')};
const MAX=1024**3;

let cur=-1;
function render(){
 $('#welcome').textContent=cfg.welcome;closePage();
 $('#grid').innerHTML=cfg.sections.map((s,i)=>`<button class="tile" data-i="${i}">${esc(s.title)}${s.sub?`<small style="color:${s.sc||'#ffd28f'}">${esc(s.sub)}</small>`:''}</button>`).join('');
}
function detailHtml(s,i){
 const mem=cfg.members.filter(m=>m.sec===s.id),hasC=s.rt||s.rp;
 return `<div class="bg" style="--h:${i*47}deg"><div class="beam"></div><i></i><i></i><i></i></div><div class="pgc"><div class="ico">${s.icon}</div><h2 class="pgt">${esc(s.title)}</h2>${s.sub?`<p class="pgs" style="color:${s.sc||'#ffd28f'}">${esc(s.sub)}</p>`:'<span></span>'}<p class="desc">${esc(s.desc)}</p><div>
 ${mem.length?`<div class="chips">${mem.map(m=>`<a href="${esc(tg(m.tg))}" target="_blank" rel="noopener">${esc(m.name)}</a>`).join('')}</div>`:''}
 <div class="row"><button class="btn" data-a="reg">ثبت‌نام در این بخش</button><button class="btn alt" data-a="con">ارتباط با مسئول</button></div>
 <div class="sub box" data-p="con"><div>${hasC?`<div class="row" style="padding-top:6px">${s.rt?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(tg(s.rt))}">تلگرام مسئول</a>`:''}${s.rp?`<a class="btn alt" href="tel:${esc(s.rp)}">تماس با مسئول</a>`:''}</div>`:'<p class="desc" style="padding-top:6px">اطلاعات ارتباط با مسئول به‌زودی اعلام می‌شود.</p>'}</div></div>
 <div class="sub box" data-p="reg"><div><div class="formcard">${formHtml(s)}</div></div></div></div></div>`}
function openPage(i,x,y){
 const P=$('#page');P.innerHTML=detailHtml(cfg.sections[i],i);P.scrollTop=0;
 P.style.setProperty('--x',x+'px');P.style.setProperty('--y',y+'px');
 document.body.classList.add('lock');void P.offsetWidth;P.classList.add('open');
 history.pushState({p:i},'','#'+cfg.sections[i].id);
 P.insertAdjacentHTML('beforeend','<button class="back" type="button" onclick="history.back()">→ بازگشت</button>');
}
function closePage(){$('#page').classList.remove('open');document.body.classList.remove('lock')}
window.addEventListener('popstate',()=>{if(!history.state||history.state.p==null)closePage()});
const formHtml=s=>`<form data-sec="${s.id}" novalidate>
<div><label>نام و نام خانوادگی</label><input name="name" required></div>
<div><label>شماره تماس</label><input name="phone" inputmode="tel" placeholder="09123456789" required></div>
<div><label>آیدی تلگرام</label><input name="tg" dir="ltr" placeholder="@username"></div>
<div><label>سابقه فعالیت در این بخش (در صورت وجود)</label><textarea name="act" rows="3"></textarea></div>
<div><label>رزومه، نمونه کار (عکس، ویدئو یا فایل — تا ۱ گیگابایت)</label><input type="file" name="file"></div>
<p class="err"></p><button class="btn" type="submit">ثبت‌نام</button></form>`;


$('#grid').addEventListener('click',e=>{
 const t=e.target.closest('.tile');if(!t)return;const r=t.getBoundingClientRect();
 openPage(+t.dataset.i,e.clientX||r.left+r.width/2,e.clientY||r.top+r.height/2);
});
$('#page').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const root=b.closest('.pgc'),p=root.querySelector(`[data-p="${b.dataset.a}"]`),was=p.classList.contains('open');
 root.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('open'));p.classList.toggle('open',!was);
 if(!was)setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'center'}),350);
});
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText('09104017402');$('#cp').textContent='کپی شد ✓'}catch(e){$('#cp').textContent='کپی نشد'}setTimeout(()=>$('#cp').textContent='کپی شماره',2000)};
$('#strip').innerHTML=Array.from({length:18},(_,i)=>`<span style="opacity:${(.05+i*.012).toFixed(2)}"></span>`).join('');
$('#page').addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,er=f.querySelector('.err'),d=new FormData(f);
 const name=d.get('name').trim(),phone=d.get('phone').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
 const file=d.get('file');
 if(!name)return er.textContent='نام و نام خانوادگی را وارد کن.';
 if(!/^09\d{9}$/.test(phone))return er.textContent='شماره تماس باید به شکل 09123456789 باشد.';
 if(file&&file.size>MAX)return er.textContent='حجم فایل بیشتر از ۱ گیگابایت است.';
 try{
  await tx('readwrite',s=>s.add({sec:f.dataset.sec,name,phone,tg:d.get('tg').trim(),act:d.get('act').trim(),file:file&&file.size?file:null,fname:file&&file.size?file.name:'',date:new Date().toLocaleString('fa-IR')}));
  f.innerHTML='<p class="ok" style="text-align:center;padding:14px 0">ثبت‌نامت انجام شد. به‌زودی باهات تماس می‌گیریم. 🎉</p>';
 }catch(x){er.textContent='ذخیره‌سازی انجام نشد. دوباره تلاش کن.'}
});

$('.hero .logo').src=$('#intro img').src;
setTimeout(()=>$('#intro').classList.add('gone'),2000);
render();

/* ---------- مدیریت ---------- */
const A=$('#admin'),P=$('#panel');
$('#adminBtn').onclick=()=>{A.classList.add('show');login()};
function login(){P.innerHTML=`<div class="card" style="padding:24px;max-width:380px;margin:12vh auto;text-align:center"><h3 style="margin-bottom:12px">ورود به بخش مدیریت</h3><input type="password" id="pw" placeholder="رمز عبور" dir="ltr"><p class="err" id="pe"></p><div class="row" style="margin-top:10px"><button class="btn" id="go">ورود</button><button class="btn alt" id="x">بستن</button></div></div>`;
 const go=()=>$('#pw').value===cfg.pass?panel('regs'):$('#pe').textContent='رمز اشتباه است.';
 $('#go').onclick=go;$('#pw').onkeydown=e=>e.key==='Enter'&&go();$('#x').onclick=()=>A.classList.remove('show');$('#pw').focus()}
const secName=id=>(cfg.sections.find(s=>s.id===id)||{}).title||id;
function panel(t){
 const T=[['regs','ثبت‌نام‌ها'],['text','ویرایش متن‌ها'],['resp','مسئولین'],['mem','اعضا'],['set','تنظیمات']];
 P.innerHTML=`<div class="row" style="justify-content:space-between"><h3>مدیریت کانون رسانه</h3><button class="btn alt" id="out">خروج</button></div><div class="tabs">${T.map(x=>`<button class="btn ${x[0]===t?'on':'alt'}" data-t="${x[0]}">${x[1]}</button>`).join('')}</div><div id="tab"></div>`;
 $('#out').onclick=()=>{A.classList.remove('show');P.innerHTML=''};
 P.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>panel(b.dataset.t));
 ({regs:tRegs,text:tText,resp:tResp,mem:tMem,set:tSet})[t]();
}
async function tRegs(){
 const all=(await tx('readonly',s=>s.getAll())).reverse(),T=$('#tab');
 T.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><select id="flt" style="width:auto"><option value="">همه بخش‌ها (${all.length})</option>${cfg.sections.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select><button class="btn alt" id="csv">خروجی اکسل (CSV)</button></div><div id="rl"></div>`;
 const draw=()=>{const v=$('#flt').value,r=all.filter(x=>!v||x.sec===v);
  $('#rl').innerHTML=r.length?r.map(x=>`<div class="item"><h4>${esc(secName(x.sec))}</h4><div>${esc(x.name)} — <a style="color:#fff" href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><div>تلگرام: ${esc(x.tg)||'—'}</div><div>سابقه: ${esc(x.act)||'—'}</div><div style="font-size:.8rem;color:#9aa6d6">${esc(x.date)}</div><div class="row" style="justify-content:flex-start">${x.file?`<a class="btn alt" download="${esc(x.fname)}" href="${URL.createObjectURL(x.file)}">دانلود رزومه (${esc(x.fname)})</a>`:''}<button class="btn alt" data-d="${x.id}">حذف</button></div></div>`).join(''):'<p class="desc">هنوز ثبت‌نامی وجود ندارد.</p>';
  $('#rl').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('حذف شود؟')){await tx('readwrite',s=>s.delete(+b.dataset.d));tRegs()}})};
 $('#flt').onchange=draw;draw();
 $('#csv').onclick=()=>{const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';const rows=[['بخش','نام','تلفن','تلگرام','سابقه','تاریخ'],...all.map(x=>[secName(x.sec),x.name,x.phone,x.tg,x.act,x.date])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='registrations.csv';a.click()};
}
function tText(){
 $('#tab').innerHTML=`<div class="item"><label>متن خوشامدگویی</label><textarea id="w" rows="3">${esc(cfg.welcome)}</textarea></div>${cfg.sections.map((s,i)=>`<div class="item"><label>عنوان بخش</label><input data-k="title" data-i="${i}" value="${esc(s.title)}"><label>زیرعنوان (اختیاری)</label><input data-k="sub" data-i="${i}" value="${esc(s.sub||'')}"><label>توضیحات</label><textarea data-k="desc" data-i="${i}" rows="4">${esc(s.desc)}</textarea></div>`).join('')}<button class="btn" id="sv">ذخیره تغییرات</button> <span class="ok" id="m"></span>`;
 $('#sv').onclick=()=>{cfg.welcome=$('#w').value;P.querySelectorAll('[data-k]').forEach(el=>cfg.sections[+el.dataset.i][el.dataset.k]=el.value);save();render();$('#m').textContent='ذخیره شد.'};
}
function tResp(){
 $('#tab').innerHTML=cfg.sections.map((s,i)=>`<div class="item"><h4>${esc(s.title)}</h4><div class="two"><div><label>آیدی تلگرام مسئول</label><input dir="ltr" data-k="rt" data-i="${i}" value="${esc(s.rt)}" placeholder="@username"></div><div><label>شماره مسئول</label><input dir="ltr" data-k="rp" data-i="${i}" value="${esc(s.rp)}" placeholder="09123456789"></div></div></div>`).join('')+`<button class="btn" id="sv">ذخیره</button> <span class="ok" id="m"></span>`;
 $('#sv').onclick=()=>{P.querySelectorAll('[data-k]').forEach(el=>cfg.sections[+el.dataset.i][el.dataset.k]=el.value.trim());save();render();$('#m').textContent='ذخیره شد.'};
}
function tMem(){
 $('#tab').innerHTML=`<div class="item"><div class="two"><input id="mn" placeholder="نام عضو"><input id="mt" dir="ltr" placeholder="آیدی تلگرام (@username)"></div><select id="ms">${cfg.sections.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select><button class="btn" id="ad">افزودن عضو</button></div>${cfg.members.map((m,i)=>`<div class="item"><div>${esc(m.name)} — <span dir="ltr">${esc(m.tg)}</span> — ${esc(secName(m.sec))}</div><div><button class="btn alt" data-r="${i}">حذف</button></div></div>`).join('')}`;
 $('#ad').onclick=()=>{const n=$('#mn').value.trim();if(!n)return;cfg.members.push({name:n,tg:$('#mt').value.trim(),sec:$('#ms').value});save();render();tMem()};
 P.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cfg.members.splice(+b.dataset.r,1);save();render();tMem()});
}
function tSet(){
 $('#tab').innerHTML=`<div class="item"><label>رمز جدید</label><input id="np" type="password" dir="ltr"><button class="btn" id="sp">تغییر رمز</button><span class="ok" id="m"></span></div>`;
 $('#sp').onclick=()=>{const v=$('#np').value;if(v.length<4)return $('#m').textContent='حداقل ۴ کاراکتر.';cfg.pass=v;save();$('#m').textContent='رمز تغییر کرد.'};
}
</script>
</body>
</html>
